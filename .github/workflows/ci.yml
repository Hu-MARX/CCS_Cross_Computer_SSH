name: Local source verification

on:
  push:
    paths-ignore: ["**/*.md"]
  pull_request:
    paths-ignore: ["**/*.md"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Use a canonical temporary directory
        shell: python
        run: |
          import os
          from pathlib import Path
          root = (Path(os.environ["RUNNER_TEMP"]) / "ccs-tests").resolve()
          root.mkdir(parents=True, exist_ok=True)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              for name in ("TEMP", "TMP", "TMPDIR"):
                  output.write(f"{name}={root}\n")
      - name: Install core
        run: python -m pip install -e .
      - name: Core checks on Linux
        if: runner.os == 'Linux'
        run: python scripts/verify.py --group core --require-linux --report evidence/core.json
      - name: Core checks on Windows
        if: runner.os == 'Windows'
        run: python scripts/verify.py --group core --report evidence/core.json
      - name: Dashboard JavaScript checks
        if: runner.os == 'Linux'
        run: node --test tests/dashboard_ui.test.js
      - name: Preserve validation record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-${{ matrix.os }}
          path: evidence/

  mcp:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        mcp: ["2.2.0", "2.3.0"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Use a canonical temporary directory
        shell: python
        run: |
          import os
          from pathlib import Path
          root = (Path(os.environ["RUNNER_TEMP"]) / "ccs-tests").resolve()
          root.mkdir(parents=True, exist_ok=True)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              for name in ("TEMP", "TMP", "TMPDIR"):
                  output.write(f"{name}={root}\n")
      - name: Install optional MCP dependency
        run: python -m pip install -e . "mcp==${{ matrix.mcp }}"
      - name: MCP checks
        run: python scripts/verify.py --group mcp --report evidence/mcp.json
      - name: Preserve validation record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mcp-${{ matrix.os }}-${{ matrix.mcp }}
          path: evidence/
